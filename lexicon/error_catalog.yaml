# Bảng lỗi / nhầm lẫn của DataMate (danh mục dùng chung cho cả nhóm).
# Dùng cho: kiểm toán (giải thích vì sao hai đường lệch), gắn nhãn câu sai trên TRAIN, viết luật kiểm.
# Mỗi mục:
#   id         mã duy nhất (H = hiểu câu, D = dữ liệu, T = tính toán, F = định dạng, C = câu chữ, Q = quyết định)
#   ten        tên ngắn
#   dau_hieu   chữ/mẫu trong câu hoặc dữ liệu cho thấy có thể gặp lỗi (regex, không dấu, chữ thường)
#   tai_tao    phép biến đổi để tái tạo đáp án sai từ đáp án đúng (kiểm toán dùng để giải thích con số lệch)
#   luat       luật rulebook phân xử (tên mục; số mục có thể khác ở rulebook private)
#   chan       cách chặn trong pipeline
#   trang_thai da_code | thiet_ke
# Thêm mục mới khi kiểm toán train gặp loại sai "chưa rõ": một mục, kèm ví dụ train (không dùng câu public/private).
#   nguon      rulebook (suy từ luật) | train (gặp khi soát train) | chung (lỗi phổ biến của code/LLM/dữ liệu) | quy_dinh (luật cuộc thi)

hieu_cau:
- id: H01
  ten: Đảo chiều so sánh (kỳ hỏi ↔ kỳ gốc)
  dau_hieu: so voi|so vs|so sanh|hon|kem|tang|giam|chenh
  tai_tao: swap(target, base)
  luat: '§1: chênh lệch = kỳ hỏi − kỳ so; % thay đổi so với kỳ trước; vế sau ''so với'' là mốc'
  chan: luật chọn nghĩa + kiểm toán K2/K4; dấu kết quả khớp phép so
  trang_thai: thiet_ke
  nguon: rulebook
- id: H02
  ten: Quý đọc thành tháng (Q1 → tháng 1)
  dau_hieu: \bq ?[1-4]\b|quy ?[1-4]|\bth ?[1-9]
  tai_tao: period(quy_q -> thang_q)
  luat: '§2: quý theo dương lịch, mỗi quý 3 tháng'
  chan: resolve_periods có quy_q_y; luật chọn nghĩa; kiểm hợp lý số đơn quý > tháng
  trang_thai: da_code
  nguon: rulebook
- id: H03
  ten: Bỏ một vế của câu nhiều điều kiện
  dau_hieu: \bva\b|\broi\b|lien tuc|ca hai|dong thoi|deu
  tai_tao: drop_condition(k)
  luat: mọi vế nối bằng 'và' đều bắt buộc
  chan: đặc tả liệt kê từng vế có span; kiểm toán M8
  trang_thai: thiet_ke
  nguon: rulebook
- id: H04
  ten: Không quy đổi đơn vị (hộp ↔ cái, thùng ↔ lon)
  dau_hieu: hop|thung|loc|vi|cai|lon|chai|goi|bao|kg|tan|m3
  tai_tao: no_unit_conversion
  luat: '§3/§5: số lượng quy về đơn vị cơ bản; câu nêu đơn vị thì theo đơn vị đó'
  chan: tách số lượng/đơn vị khi đọc; metamorphic M3; RuleTests
  trang_thai: thiet_ke
  nguon: rulebook
- id: H05
  ten: Tính nhầm đơn huỷ / đơn trả (kể cả trả một phần) vào doanh thu
  dau_hieu: doanh thu|ban duoc|thu ve|so don
  tai_tao: include(status in [huy, tra_hang])
  luat: '§1: bỏ đơn huỷ và cả đơn có trả hàng; đơn đang giao vẫn tính'
  chan: APPLY_RULE tự chèn theo measure; metamorphic M1/M2
  trang_thai: thiet_ke
  nguon: rulebook
- id: H06
  ten: Khớp tên quá rộng / quá hẹp (một SKU hay mọi biến thể)
  dau_hieu: ten hang co nhieu bien the (size, quy cach)
  tai_tao: entity_scope(narrow <-> broad)
  luat: '§8: tên gọi khác nhau của cùng một thứ là cùng một thứ; file có mã thì theo mã'
  chan: chỉ mục giá trị trả MỌI ứng viên; cấm str.contains chuỗi ngắn
  trang_thai: thiet_ke
  nguon: rulebook
- id: H07
  ten: Năm của kỳ không ghi năm
  dau_hieu: thang \d{1,2}(?!/)|quy \d(?!/)
  tai_tao: year(this <-> last)
  luat: '§2: năm nay nếu không sau hôm nay; sau hôm nay thì năm trước'
  chan: resolve_periods
  trang_thai: da_code
  nguon: rulebook
- id: H08
  ten: '"Tháng trước" tính theo hôm nay hay theo kỳ được hỏi'
  dau_hieu: thang truoc|ky truoc|cung ky
  tai_tao: anchor(as_of <-> asked_period)
  luat: §2
  chan: luật chọn nghĩa
  trang_thai: thiet_ke
  nguon: rulebook
- id: H09
  ten: '"Tháng này so với tháng trước" không lấy cùng số ngày'
  dau_hieu: thang nay.*(so|hon|tang|giam)
  tai_tao: base_period(full_month <-> same_days)
  luat: '§2: tháng trước lấy cùng số ngày; tháng ngắn thì đến hết tháng'
  chan: P['thang_truoc_cung_ky']
  trang_thai: da_code
  nguon: rulebook
- id: H10
  ten: Tuần bắt đầu sai (Chủ nhật thay vì thứ Hai); tuần này lấy cả tuần
  dau_hieu: tuan nay|tuan truoc|tuan roi
  tai_tao: week_start(mon <-> sun) | week_end(today <-> sunday)
  luat: '§2: tuần bắt đầu thứ Hai; tuần này đến hết hôm nay; tuần trước cả tuần'
  chan: resolve_periods; metamorphic M5 (biên kỳ)
  trang_thai: da_code
  nguon: rulebook
- id: H11
  ten: Biên ngưỡng ≥ và >
  dau_hieu: tro len|it nhat|toi thieu|hon|qua|tren|duoi
  tai_tao: threshold(ge <-> gt)
  luat: '§2: quá/hơn/trên/dưới không gồm N; từ N trở lên gồm N'
  chan: cảnh báo trong prompt; luật chọn nghĩa
  trang_thai: da_code
  nguon: rulebook
- id: H12
  ten: Phát sinh trong kỳ hay số còn lại đến hết ngày
  dau_hieu: con no|con ton|con lai|den het|tinh den
  tai_tao: flow <-> stock
  luat: '§2: ''đến hết ngày X'' = tình trạng lúc hết ngày, tính từ đầu dữ liệu'
  chan: luật chọn nghĩa
  trang_thai: thiet_ke
  nguon: rulebook
- id: H13
  ten: Mẫu số của trung bình (mỗi đơn / ngày / khách / ngày có bán)
  dau_hieu: trung binh|binh quan|moi (don|ngay|khach)
  tai_tao: denominator(k)
  luat: chữ sau 'mỗi' quyết định mẫu số
  chan: metric chuẩn có mẫu số cố định
  trang_thai: thiet_ke
  nguon: rulebook
- id: H14
  ten: Thứ hạng cụ thể (nhì / thứ k) hay top-k
  dau_hieu: nhi\b|thu hai|thu \d|top \d
  tai_tao: rank(k-th <-> top-k)
  luat: '''thứ k'' là một phần tử; ''top k'' là danh sách'
  chan: đặc tả output.type
  trang_thai: thiet_ke
  nguon: rulebook
- id: H15
  ten: Mẫu số tỉ trọng (cả shop hay trong nhóm)
  dau_hieu: chiem|ti trong|phan tram
  tai_tao: share_base(shop <-> group)
  luat: '§1: tỉ trọng nhóm chia doanh thu cả shop (gồm khách vãng lai, phí phục vụ)'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
- id: H16
  ten: '"Ai" là khách hay nhân viên'
  dau_hieu: \bai\b|nguoi nao
  tai_tao: who(customer <-> staff)
  luat: nhân viên/NV/bán giỏi/đứng ca → nhân viên; còn lại → khách
  chan: luật chọn nghĩa
  trang_thai: thiet_ke
  nguon: rulebook
- id: H17
  ten: Tiêu chí xếp hạng sai (số dòng / số tiền thay vì số lượng quy đổi)
  dau_hieu: ban chay|nhieu nhat|it nhat|loi nhat
  tai_tao: rank_by(qty_base <-> lines <-> revenue)
  luat: '§3: bán chạy theo số lượng quy về đơn vị cơ bản; lời nhất theo lãi gộp; NV giỏi theo doanh thu'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
- id: H18
  ten: Hoà hạng không xếp theo mã tăng dần
  dau_hieu: nhat|top|xep hang
  tai_tao: tie_break(code_asc <-> other)
  luat: bằng nhau xếp theo mã tăng dần
  chan: RANK(tie=code asc) trong trình biên dịch; RuleTests
  trang_thai: thiet_ke
  nguon: rulebook
- id: H19
  ten: Khách lẻ / vãng lai bị đếm hoặc xếp hạng
  dau_hieu: khach|so khach|khach nao
  tai_tao: include(walk_in)
  luat: '§3: khách lẻ không phải khách; §4: vẫn tính vào tổng nợ'
  chan: cờ is_walkin; metamorphic M6
  trang_thai: thiet_ke
  nguon: rulebook
- id: H20
  ten: COD / sàn TMĐT bị tính là khách nợ
  dau_hieu: no|cong no|tuoi no
  tai_tao: include(channel in [cod, san])
  luat: §4
  chan: RuleTests; metamorphic M6
  trang_thai: thiet_ke
  nguon: rulebook
- id: H21
  ten: Tuổi nợ tính từ hạn thanh toán thay vì ngày đặt
  dau_hieu: tuoi no|qua han|no lau
  tai_tao: age_from(order_date <-> due_date)
  luat: '§4: từ ngày đặt; đặt hôm nay = 0 ngày'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
- id: H22
  ten: Tết / ca sáng-chiều tính sai khoảng
  dau_hieu: tet|ca sang|ca chieu
  tai_tao: window(shift)
  luat: '§2: Tết = 23 Chạp → mùng 10 Giêng; ca sáng 06:00–13:59, ca chiều 14:00–21:59'
  chan: tet_window từ calendar.csv
  trang_thai: da_code
  nguon: rulebook
- id: H23
  ten: '"Bán được bao nhiêu tiền" hiểu là tiền khách đã trả'
  dau_hieu: ban duoc bao nhieu tien|thu ve
  tai_tao: revenue <-> paid
  luat: '§1: là doanh thu, không phải tiền đã trả'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
du_lieu:
- id: D01
  ten: Ô trống ở dòng tiếp nối của nhóm dòng không được điền
  dau_hieu: cột mã đơn trống ở các dòng sau, các cột cấp-đơn trống cùng chỗ
  tai_tao: drop_group_fill
  luat: '§8: ô trống ở dòng sau của nhóm dòng giống dòng đầu nhóm'
  chan: fill_row_groups khi đọc dữ liệu
  trang_thai: da_code
  nguon: rulebook
- id: D02
  ten: Bỏ trùng ở bảng không ghi theo đơn
  dau_hieu: bảng không có cột mã đơn, có dòng giống hệt nhau
  tai_tao: dedupe_all
  luat: '§8: bảng không ghi theo đơn, hai dòng giống nhau vẫn tính cả hai'
  chan: drop_same_order_duplicates chỉ khi có mã đơn; prompt cấm tự bỏ trùng
  trang_thai: da_code
  nguon: rulebook
- id: D03
  ten: Không bỏ dòng trùng của cùng một đơn
  dau_hieu: hai dòng cùng mã đơn giống mọi ô
  tai_tao: keep_duplicates
  luat: '§8: lỗi xuất file, tính một lần'
  chan: drop_same_order_duplicates
  trang_thai: da_code
  nguon: rulebook
- id: D04
  ten: Cột số lượng lẫn '3 chai' và '3'
  dau_hieu: cột số lượng một phần có chữ đơn vị
  tai_tao: qty_as_text
  luat: '-'
  chan: type_columns tách số + cột __dv
  trang_thai: da_code
  nguon: rulebook
- id: D05
  ten: Dòng Tổng/Cộng hoặc header lặp lọt vào số liệu
  dau_hieu: ^(tong|cong|total)
  tai_tao: include_total_rows
  luat: '-'
  chan: clean_table
  trang_thai: da_code
  nguon: rulebook
- id: D06
  ten: Mã có khoảng trắng làm nối bảng hụt
  dau_hieu: mã có dấu cách đầu/cuối hoặc giữa
  tai_tao: no_strip
  luat: '-'
  chan: strip mã khi đọc
  trang_thai: da_code
  nguon: rulebook
- id: D07
  ten: Sót giá trị trạng thái hiếm (chỉ có vài tháng)
  dau_hieu: giá trị trạng thái xuất hiện < 1%
  tai_tao: drop_rare_status
  luat: '§8: mỗi đơn đúng một trong bốn trạng thái'
  chan: ánh xạ MỌI giá trị trạng thái; audit D6
  trang_thai: thiet_ke
  nguon: rulebook
- id: D08
  ten: Dấu . , hoặc ngày/tháng đọc sai
  dau_hieu: 1.234 / 1,234; 03/04 vs 04/03
  tai_tao: swap_thousands | swap_dayfirst
  luat: README của shop
  chan: decide_thousands, decide_dayfirst theo cả cột
  trang_thai: da_code
  nguon: rulebook
- id: D09
  ten: Tiền viết tắt '1tr380', '250k', '(250k)'
  dau_hieu: tr\d|k$|\(.*\)
  tai_tao: parse_money_naive
  luat: '-'
  chan: parse_money_one
  trang_thai: da_code
  nguon: rulebook
- id: D10
  ten: Ngày không ghi năm
  dau_hieu: dd/mm không năm
  tai_tao: year_from_today
  luat: '§8: năm của sheet chứa dòng đó'
  chan: year_hint từ tên sheet/file
  trang_thai: da_code
  nguon: rulebook
- id: D11
  ten: Lấy nhầm ngày giao / ngày thu làm ngày đơn
  dau_hieu: bảng có nhiều cột ngày
  tai_tao: date_col(order <-> delivery <-> payment)
  luat: '§1: theo ngày đặt'
  chan: README + thẻ dữ liệu; cấu hình shop
  trang_thai: thiet_ke
  nguon: rulebook
- id: D12
  ten: Gộp nhầm khách khác tên ('Lan' / 'Lân') hoặc tách nhầm cùng tên khác cách viết
  dau_hieu: tên khách gần giống
  tai_tao: merge_customers(fuzzy) | split_customers(case)
  luat: '§3: có mã thì theo mã; không mã thì tên chỉ khác cách viết là cùng khách, khác chữ là khác khách'
  chan: key() (hoa thường, dấu cách); không gộp mờ
  trang_thai: da_code
  nguon: rulebook
- id: D13
  ten: Phí phục vụ / topping được xếp hạng như món
  dau_hieu: phi phuc vu|topping|size
  tai_tao: include_service_fee_in_rank
  luat: '§3: phí phục vụ không phải mặt hàng nhưng vẫn tính doanh thu'
  chan: cờ is_service_fee
  trang_thai: thiet_ke
  nguon: rulebook
- id: D14
  ten: Bảng tổng hợp bị cộng chung với bảng giao dịch
  dau_hieu: bảng báo cáo theo tháng cạnh sổ chi tiết
  tai_tao: double_count
  luat: '-'
  chan: phân loại bảng giao dịch / tổng hợp
  trang_thai: thiet_ke
  nguon: rulebook
- id: D15
  ten: Các file cùng cấu trúc nhưng khác định dạng khi gộp
  dau_hieu: kiểu cột 'hỗn hợp' sau khi gộp
  tai_tao: mixed_types
  luat: '-'
  chan: merge_same_structure ghi 'hỗn hợp'; audit D8
  trang_thai: da_code
  nguon: rulebook
tinh_toan:
- id: T01
  ten: Làm tròn sai (số thực, không HALF_UP)
  dau_hieu: phan tram|trung binh|ti le
  tai_tao: round_half_even
  luat: '§3/§9: nửa đồng làm tròn lên; % 2 chữ số'
  chan: rhu(), pct()
  trang_thai: da_code
  nguon: rulebook
- id: T02
  ten: Mẫu số tỉ lệ huỷ chỉ gồm đơn hợp lệ
  dau_hieu: ti le huy
  tai_tao: denominator(valid_orders)
  luat: '§1: mẫu số là mọi đơn đặt trong kỳ, mọi trạng thái'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
- id: T03
  ten: Giảm giá cả đơn bị trừ vào doanh thu
  dau_hieu: doanh thu
  tai_tao: subtract_order_discount
  luat: '§1: chỉ trừ giảm giá trên từng dòng'
  chan: metric chuẩn
  trang_thai: thiet_ke
  nguon: rulebook
- id: T04
  ten: Dấu của tăng trưởng sai
  dau_hieu: tang|giam|thay doi
  tai_tao: abs(result)
  luat: '§1: giảm ra số âm'
  chan: 'kiểm hợp lý: dấu khớp A > B'
  trang_thai: thiet_ke
  nguon: rulebook
- id: T05
  ten: Mặt hàng không có giao dịch trả unanswerable thay vì 0
  dau_hieu: ban duoc bao nhieu
  tai_tao: zero -> unanswerable
  luat: '§7: chỉ không trả lời được khi kỳ ngoài dữ liệu hoặc shop không ghi loại thông tin'
  chan: luật 'không trả lời được' (v3 5.4)
  trang_thai: thiet_ke
  nguon: rulebook
dinh_dang:
- id: F01
  ten: Phần trăm ghi dạng 0.124
  tai_tao: pct/100
  luat: '§9: 12,4 % ghi 12.4'
  chan: format_answer + prompt
  trang_thai: da_code
  nguon: rulebook
- id: F02
  ten: Số ghi dạng chuỗi / có đơn vị / có dấu nghìn
  tai_tao: str(number)
  luat: §9
  chan: format_answer
  trang_thai: da_code
  nguon: rulebook
- id: F03
  ten: Câu theo tháng nhưng trả ngày (hoặc ngược lại)
  tai_tao: date_granularity
  luat: '§9: theo tháng thì YYYY-MM'
  chan: format_answer + đặc tả output
  trang_thai: da_code
  nguon: rulebook
- id: F04
  ten: List một phần tử bị trả thành chuỗi; thứ tự list sai
  tai_tao: list->str | reorder
  luat: '§9: câu nhiều số ghi list theo đúng thứ tự câu hỏi'
  chan: format_answer + đặc tả output
  trang_thai: da_code
  nguon: rulebook
- id: F05
  ten: Tên trả về không lấy nguyên từ dữ liệu (thêm nhãn, đổi cách viết)
  tai_tao: decorate_name
  luat: '§9: tên lấy nguyên từ dữ liệu'
  chan: lấy tên từ bảng, không từ câu đã chuẩn hoá
  trang_thai: thiet_ke
  nguon: rulebook
cau_chu:
- id: C01
  ten: Từ thật bị khoá nhầm thành tên hàng ('hôm qua' → 'quả')
  tai_tao: protect_short_unaccented_term
  chan: chỉ khớp bỏ dấu khi người hỏi không gõ dấu và tên ≥ 5 ký tự
